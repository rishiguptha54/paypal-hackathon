services:
  - type: web
    name: intentlock
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run before each deploy, never at request time.
    preDeployCommand: npm run db:migrate
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_MCP_COMMAND
        value: ''
      - key: AI_PROVIDER
        value: rule
      - key: PRODUCT_SOURCE
        value: fixture
      - key: APPROVAL_TTL_SECONDS
        value: 900
      - key: POLICY_VERSION
        value: v1
      - key: STUDIO_AGENT_ENABLED
        value: false
      - key: DEMO_CONTROLS_ENABLED
        value: false
      - key: SESSION_SECRET
        generateValue: true
      # Secrets: set these in the Render dashboard (sync: false keeps them out of git).
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
