  /audit:
    get:
      summary: Read the session-scoped decision ledger
      parameters:
        - in: query
          name: limit
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: cursor
          schema:
            type: string
            maxLength: 512
        - in: query
          name: decision
          schema:
            type: string
            enum:
              - ALLOWED
              - BLOCKED
              - NEEDS_REVIEW
        - in: query
          name: state
          schema:
            type: string
            enum:
              - PENDING_APPROVAL
              - APPROVED
              - ORDER_CREATED
              - CAPTURING
              - CAPTURED
              - CAPTURE_PENDING
              - CAPTURE_FAILED
              - BLOCKED_AT_CAPTURE
              - CANCELLED
              - EXPIRED
              - REVERSED
        - in: query
          name: seeded
          schema:
            type: string
            enum:
              - "true"
              - "false"
      responses:
        "200":
          description: Cursor-paginated ledger.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        time:
                          type: string
                        kind:
                          type: string
                          enum:
                            - OFFER
                            - PURCHASE
                            - REQUEST_REJECTED
                        product:
                          type: string
                        merchant:
                          type:
                            - string
                            - "null"
                        source:
                          anyOf:
                            - type: string
                              enum:
                                - channel3
                                - fixture
                            - type: string
                              const: none
                        decision:
                          type: string
                          enum:
                            - ALLOWED
                            - BLOCKED
                            - NEEDS_REVIEW
                        reasonCodes:
                          type: array
                          items:
                            type: string
                        approvalHashStatus:
                          type: string
                          enum:
                            - NONE
                            - LOCKED
                            - VERIFIED
                            - MISMATCH
                        paypalOrderId:
                          type: string
                        mcpTraceStatus:
                          type: string
                          enum:
                            - NONE
                            - OK
                            - FALLBACK_REST
                            - ERROR
                        state:
                          type: string
                          enum:
                            - PENDING_APPROVAL
                            - APPROVED
                            - ORDER_CREATED
                            - CAPTURING
                            - CAPTURED
                            - CAPTURE_PENDING
                            - CAPTURE_FAILED
                            - BLOCKED_AT_CAPTURE
                            - CANCELLED
                            - EXPIRED
                            - REVERSED
                        total:
                          type: object
                          properties:
                            minor:
                              type: string
                              pattern: ^\d{1,18}$
                            currency:
                              type: string
                              const: USD
                            display:
                              type: string
                          required:
                            - minor
                            - currency
                            - display
                          additionalProperties: false
                        seeded:
                          type: boolean
                      required:
                        - id
                        - time
                        - kind
                        - product
                        - merchant
                        - source
                        - decision
                        - reasonCodes
                        - approvalHashStatus
                        - mcpTraceStatus
                        - seeded
                      additionalProperties: false
