                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  version:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  status:
                    type: string
                    enum:
                      - DRAFT
                      - NEEDS_CLARIFICATION
                      - CONFIRMED
                      - SUPERSEDED
                  requestText:
                    type: string
                    maxLength: 1000
                  productQuery:
                    type: string
                  quantity:
                    type: integer
                    minimum: 1
                    maximum: 100
                  maxTotal:
                    type: string
                  currency:
                    type: string
                    const: USD
                  allowedMerchantDomains:
                    type: array
                    items: {}
                  recurringAllowed:
                    type: boolean
                  excludedTerms:
                    type: array
                    items:
                      type: string
                  clarificationQuestions:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          enum:
                            - productQuery
                            - quantity
                            - maxTotal
                            - currency
                            - allowedMerchantDomains
                        question:
                          type: string
                          minLength: 1
                          maxLength: 240
                      required:
                        - field
                        - question
                      additionalProperties: false
                  parser:
                    type: string
                  createdAt:
                    type: string
                  confirmedAt:
                    type: string
                required:
                  - id
                  - version
                  - status
                  - requestText
                  - recurringAllowed
                  - excludedTerms
                  - clarificationQuestions
                  - parser
                  - createdAt
                additionalProperties: false
        "404":
          description: Request rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /mandates/{id}/confirm:
    post:
      summary: Confirm or version a mandate
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productQuery:
                  type: string
                  minLength: 2
                  maxLength: 200
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 100
                maxTotal:
                  type: string
                  pattern: ^\d{1,9}(?:\.\d{1,2})?$
                currency:
                  type: string
                  const: USD
                allowedMerchantDomains:
                  minItems: 1
                  maxItems: 20
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 253
                recurringAllowed:
                  default: false
                  type: boolean
                excludedTerms:
                  default: []
                  maxItems: 20
                  type: array
                  items:
                    type: string
                    minLength: 2
                    maxLength: 40
              required:
                - productQuery
                - quantity
                - maxTotal
                - currency
                - allowedMerchantDomains
              additionalProperties: false
      responses:
        "200":
          description: Confirmed mandate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  version:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  status:
                    type: string
                    enum:
                      - DRAFT
                      - NEEDS_CLARIFICATION
                      - CONFIRMED
                      - SUPERSEDED
                  requestText:
                    type: string
                    maxLength: 1000
                  productQuery:
                    type: string
                  quantity:
                    type: integer
                    minimum: 1
                    maximum: 100
                  maxTotal:
                    type: string
                  currency:
                    type: string
                    const: USD
                  allowedMerchantDomains:
                    type: array
                    items: {}
                  recurringAllowed:
                    type: boolean
                  excludedTerms:
                    type: array
                    items:
                      type: string
                  clarificationQuestions:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          enum:
                            - productQuery
                            - quantity
                            - maxTotal
                            - currency
                            - allowedMerchantDomains
                        question:
                          type: string
                          minLength: 1
                          maxLength: 240
                      required:
                        - field
                        - question
                      additionalProperties: false
                  parser:
                    type: string
                  createdAt:
                    type: string
                  confirmedAt:
                    type: string
                required:
                  - id
                  - version
                  - status
                  - requestText
                  - recurringAllowed
                  - excludedTerms
                  - clarificationQuestions
                  - parser
                  - createdAt
                additionalProperties: false
        "400":
          description: Invalid or unexpected request fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "404":
          description: Request rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "409":
          description: Request rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /mandates/{id}/search:
    post:
      summary: Search and evaluate catalog offers
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        "200":
          description: Offer snapshots and deterministic evaluations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                    enum:
                      - channel3
                      - fixture
                  offers:
                    type: array
                    items:
                      type: object
                      properties:
                        snapshotId:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                        source:
                          type: string
                          enum:
                            - channel3
                            - fixture
                        title:
                          type: string
                        brand:
                          type: string
                        merchantName:
                          type: string
                        merchantDomain:
                          type: string
                        offerUrl:
                          type: string
                        unitPrice:
                          type: object
                          properties:
                            minor:
                              type: string
                              pattern: ^\d{1,18}$
                            currency:
                              type: string
                              const: USD
                            display:
                              type: string
                          required:
                            - minor
                            - currency
                            - display
                          additionalProperties: false
                        totalPrice:
                          type: object
                          properties:
                            minor:
                              type: string
                              pattern: ^\d{1,18}$
                            currency:
                              type: string
                              const: USD
                            display:
                              type: string
                          required:
                            - minor
                            - currency
                            - display
                          additionalProperties: false
                        recurrenceSignal:
                          type: string
                          enum:
                            - NONE
                            - RECURRING
                            - AMBIGUOUS
                        decision:
                          type: string
                          enum:
                            - ALLOWED
                            - BLOCKED
                            - NEEDS_REVIEW
                        findings:
                          type: array
                          items:
                            type: object
                            properties:
                              code:
                                type: string
                              severity:
                                type: string
                                enum:
                                  - BLOCKING
                                  - REVIEW
                                  - INFO
                              message:
                                type: string
                              evidence:
                                type: object
                                propertyNames:
                                  type: string
                                additionalProperties:
                                  type:
                                    - string
                                    - number
                                    - boolean
                            required:
                              - code
                              - severity
                              - message
                              - evidence
                            additionalProperties: false
                        policyVersion:
                          type: string
                        observedAt:
                          type: string
                        seeded:
                          type: boolean
                      required:
                        - snapshotId
                        - source
                        - title
                        - recurrenceSignal
                        - decision
                        - findings
                        - policyVersion
                        - observedAt
                        - seeded
                      additionalProperties: false
                required:
                  - source
                  - offers
                additionalProperties: false
        "400":
          description: Invalid or unexpected request fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "404":
          description: Request rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "409":
          description: Request rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "504":
          description: Request rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /purchases:
    post:
      summary: Create a purchase from a freshly evaluated allowed offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mandateId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                offerSnapshotId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              required:
                - mandateId
                - offerSnapshotId
              additionalProperties: false
      responses:
        "201":
          description: Purchase with server-calculated money and mandate hash.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  mandateId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  offerSnapshotId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  mandateHash:
                    type: string
                    pattern: ^[a-f0-9]{64}$
                  state:
                    type: string
                    enum:
                      - PENDING_APPROVAL
                      - APPROVED
                      - ORDER_CREATED
                      - CAPTURING
                      - CAPTURED
                      - CAPTURE_PENDING
                      - CAPTURE_FAILED
                      - BLOCKED_AT_CAPTURE
                      - CANCELLED
                      - EXPIRED
                      - REVERSED
                  quantity:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  itemName:
                    type: string
                  unitPrice:
                    type: object
                    properties:
                      minor:
                        type: string
                        pattern: ^\d{1,18}$
                      currency:
                        type: string
                        const: USD
                      display:
                        type: string
                    required:
                      - minor
                      - currency
                      - display
                    additionalProperties: false
                  total:
                    type: object
                    properties:
                      minor:
                        type: string
                        pattern: ^\d{1,18}$
                      currency:
                        type: string
                        const: USD
                      display:
                        type: string
                    required:
                      - minor
                      - currency
                      - display
                    additionalProperties: false
                  approvedAt:
                    type: string
                  approvalExpiresAt:
                    type: string
                  paypalOrderId:
                    type: string
                  paypalCaptureId:
                    type: string
                  paypalStatus:
                    type: string
                  blockReasons:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        severity:
                          type: string
                          enum:
                            - BLOCKING
                            - REVIEW
                            - INFO
                        message:
                          type: string
                        evidence:
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            type:
                              - string
                              - number
                              - boolean
                      required:
                        - code
                        - severity
