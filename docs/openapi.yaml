openapi: 3.1.0
info:
  title: IntentLock API
  version: 1.0.0
  description: Session-scoped policy-governed procurement API. PayPal Sandbox only.
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Read dependency status values
      responses:
        "200":
          description: Health status values only.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                      - down
                  checks:
                    type: object
                    properties:
                      db:
                        type: string
                        enum:
                          - ok
                          - degraded
                          - down
                      paypal:
                        type: string
                        enum:
                          - ok
                          - degraded
                          - down
                      paypalMcp:
                        type: string
                        enum:
                          - ok
                          - degraded
                          - down
                      catalog:
                        type: string
                        enum:
                          - ok
                          - degraded
                          - down
                      ai:
                        type: string
                        enum:
                          - ok
                          - degraded
                          - down
                    required:
                      - db
                      - paypal
                      - paypalMcp
                      - catalog
                      - ai
                    additionalProperties: false
                required:
                  - status
                  - checks
                additionalProperties: false
        "503":
          description: Request rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /config:
    get:
      summary: Read public configuration and judge presets
      responses:
        "200":
          description: Public client configuration. No secrets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paypalClientId:
                    type: string
                  productSource:
                    type: string
                    enum:
                      - channel3
                      - fixture
                  aiProvider:
                    type: string
                    enum:
                      - gemini
                      - rule
                  environment:
                    type: string
                    const: sandbox
                  merchantPresets:
                    type: array
                    items:
                      type: string
                  scenarioPresets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          enum:
                            - HAPPY_PATH
                            - BLOCKED_OFFER
                            - PRECAPTURE_DRIFT
                        label:
                          type: string
                        requestText:
                          type: string
                      required:
                        - id
                        - label
                        - requestText
                      additionalProperties: false
                  demoControlsEnabled:
                    type: boolean
                  studioAgentEnabled:
                    default: false
                    type: boolean
                required:
                  - paypalClientId
                  - productSource
                  - aiProvider
                  - environment
                  - merchantPresets
                  - scenarioPresets
                  - demoControlsEnabled
                  - studioAgentEnabled
                additionalProperties: false
        "503":
          description: Request rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
  /mandates:
    post:
      summary: Parse purchase intent into a draft mandate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestText:
                  type: string
                  minLength: 2
                  maxLength: 1000
              required:
                - requestText
              additionalProperties: false
      responses:
        "201":
          description: Draft mandate or clarification questions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  version:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  status:
                    type: string
                    enum:
                      - DRAFT
                      - NEEDS_CLARIFICATION
                      - CONFIRMED
                      - SUPERSEDED
                  requestText:
                    type: string
                    maxLength: 1000
                  productQuery:
                    type: string
                  quantity:
                    type: integer
                    minimum: 1
                    maximum: 100
                  maxTotal:
                    type: string
                  currency:
                    type: string
                    const: USD
                  allowedMerchantDomains:
                    type: array
                    items: {}
                  recurringAllowed:
                    type: boolean
                  excludedTerms:
                    type: array
                    items:
                      type: string
                  clarificationQuestions:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          enum:
                            - productQuery
                            - quantity
                            - maxTotal
                            - currency
                            - allowedMerchantDomains
                        question:
                          type: string
                          minLength: 1
                          maxLength: 240
                      required:
                        - field
                        - question
                      additionalProperties: false
                  parser:
                    type: string
                  createdAt:
                    type: string
                  confirmedAt:
                    type: string
                required:
                  - id
                  - version
                  - status
                  - requestText
                  - recurringAllowed
                  - excludedTerms
                  - clarificationQuestions
                  - parser
                  - createdAt
                additionalProperties: false
        "400":
          description: Invalid or unexpected request fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "429":
          description: Request rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "502":
          description: Request rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "504":
          description: Request rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      requestId:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                      - code
                      - message
                      - requestId
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
